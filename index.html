<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Olerant Products — 自作プロダクトの展示室</title>
  <meta name="description" content="AI×バニラ志向の自作プロダクトを日本語で紹介するショーケース。実物はすべてGitHubにあります。">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂️</text></svg>">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <p class="eyebrow"><span class="brand-mark" aria-hidden="true">o.</span> OLERANT PRODUCTS</p>
      <h1>Olerant Products</h1>
      <p class="tagline">自作プロダクトの展示室。実物はすべて GitHub にあります。</p>
      <p class="profile-link">
        <a class="site-cta" href="https://olerant.spiel-life.com/" target="_blank" rel="noopener noreferrer">オレラントのページへ <span aria-hidden="true">↗</span><span class="sr-only">（新しいタブで開きます）</span></a>
        <a class="secondary-link" href="https://github.com/olerant-llm" target="_blank" rel="noopener noreferrer">GitHub ↗<span class="sr-only">（新しいタブで開きます）</span></a>
      </p>
    </div>
  </header>

  <main class="container">
    <div class="collection-heading"><div><p class="eyebrow">THE COLLECTION</p><h2>作品を探す</h2></div><p class="count" id="count" role="status"></p></div>
    <nav class="filter-bar" id="filterBar" aria-label="タグで絞り込み"></nav>
    <section class="grid" id="grid" aria-label="プロダクト一覧"></section>
    <noscript>作品の表示にはJavaScriptを有効にしてください。上部のGitHubからも作品をご覧いただけます。</noscript>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-invitation"><div><p class="eyebrow">BEYOND THE COLLECTION</p><h2>オレラントのページも、どうぞ。</h2></div><a class="site-cta" href="https://olerant.spiel-life.com/" target="_blank" rel="noopener noreferrer">オレラントのページへ ↗<span class="sr-only">（新しいタブで開きます）</span></a></div>
      <p>© olerant-llm</p>
    </div>
  </footer>

  <dialog id="detailDialog" aria-label="プロダクト詳細">
    <button class="detail-close" id="detailClose" aria-label="閉じる">×</button>
    <div class="detail-content" id="detailContent"></div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
